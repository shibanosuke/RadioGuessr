<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RadioGuessr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg1:#3b2f93; --bg2:#1b1646; --bg3:#0d0a29;
  --panel:#231f5a; --panel2:#2d2970; --line:#ffffff1f;
  --purple:#7950e8; --purple-s:#4d2fb0;
  --green:#6cb928; --green-s:#44801a;
  --yellow:#fecd19; --yellow-s:#b88f00;
  --pink:#e8445a; --ink:#fff; --mute:#b9b4e6; --amber:#f2a93b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Hind","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1.5px 1.5px at 12% 22%,#fffc,transparent),radial-gradient(1px 1px at 27% 68%,#fff9,transparent),
    radial-gradient(1.5px 1.5px at 41% 12%,#fffb,transparent),radial-gradient(1px 1px at 58% 84%,#fff8,transparent),
    radial-gradient(1.5px 1.5px at 73% 30%,#fffc,transparent),radial-gradient(1px 1px at 86% 62%,#fff9,transparent),
    radial-gradient(1px 1px at 92% 10%,#fff9,transparent),radial-gradient(1.5px 1.5px at 6% 88%,#fffa,transparent),
    radial-gradient(ellipse at 50% 28%,var(--bg1),var(--bg2) 55%,var(--bg3));
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button,select{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.it{font-style:italic;font-weight:700}

/* ボタン (GeoGuessr風の立体ボタン) */
.gbtn{font-family:"Hind",sans-serif;font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  background:var(--c,var(--purple));color:var(--t,#fff);border-radius:999px;padding:10px 26px;font-size:17px;line-height:1.2;
  box-shadow:0 4px 0 var(--s,var(--purple-s)),0 10px 18px #0006;transition:transform .08s,box-shadow .08s,filter .15s}
.gbtn:hover:not(:disabled){filter:brightness(1.1)}
.gbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--s,var(--purple-s)),0 4px 8px #0006}
.gbtn:disabled{--c:#5b5788;--s:#403d66;--t:#c9c5ec;cursor:default}
.gbtn.green{--c:var(--green);--s:var(--green-s)}
.gbtn.yellow{--c:var(--yellow);--s:var(--yellow-s);--t:#1b1646}
.gbtn.sm{padding:8px 20px;font-size:15px}

/* HUD */
#hud{position:fixed;z-index:500;top:calc(env(safe-area-inset-top) + 14px);left:14px;display:flex;background:#150f3dcc;
  backdrop-filter:blur(6px);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #0006,inset 0 0 0 1px var(--line)}
#hud div{padding:8px 18px;text-align:center;min-width:76px}
#hud div+div{border-left:1px solid var(--line)}
#hud small{display:block;font-size:11px;font-style:italic;font-weight:600;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
#hud b{font-size:20px;font-style:italic;font-variant-numeric:tabular-nums;line-height:1.2}
#seg{position:fixed;z-index:500;top:calc(env(safe-area-inset-top) + 14px);right:14px;display:flex;background:#150f3dcc;border-radius:999px;padding:4px;
  box-shadow:0 8px 24px #0006,inset 0 0 0 1px var(--line)}
#seg button{background:none;padding:6px 16px;border-radius:999px;font-style:italic;font-weight:700;font-size:14px;text-transform:uppercase;color:var(--mute)}
#seg button[aria-pressed=true]{background:var(--purple);color:#fff}

/* ステージ (ラジオ) */
#stage{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:70px 16px 120px;transition:opacity .3s}
body.result #stage{opacity:0;visibility:hidden}
#status{font-size:clamp(26px,5vw,40px);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1}
#sub{color:var(--mute);font-size:14px;min-height:21px;margin-top:-6px}
.radio{width:min(760px,92vw);background:linear-gradient(180deg,#2e2a78,#1e1a52);border-radius:26px;padding:18px;
  box-shadow:0 20px 50px #0008,inset 0 0 0 1px var(--line),inset 0 2px 0 #ffffff24}
.dial{position:relative;height:150px;border-radius:16px;background:#0d0a26;overflow:hidden;box-shadow:inset 0 4px 14px #000c}
.dial::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ffffff1c 0,transparent 38%);pointer-events:none}
.scale{position:absolute;left:20px;right:20px;top:24px;height:48px;
  background:
   repeating-linear-gradient(90deg,#f6d9a5 0 1.5px,transparent 1.5px 14px) 0 100%/100% 14px no-repeat,
   repeating-linear-gradient(90deg,#f6d9a5 0 2px,transparent 2px 70px) 0 100%/100% 32px no-repeat;opacity:.85}
.nums{position:absolute;left:14px;right:14px;top:80px;display:flex;justify-content:space-between;font-size:14px;font-style:italic;font-weight:600;color:#f6d9a5bb;font-variant-numeric:tabular-nums}
.nums span{width:30px;text-align:center}
.needle{position:absolute;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--amber);left:50%;
  box-shadow:0 0 14px 3px #f2a93bbb;transition:left 1s cubic-bezier(.25,.85,.3,1)}
.dial.tuning .needle{transition:left .33s linear}
.dial.off .needle{background:#7d6b4d;box-shadow:none}
#freq{position:absolute;left:22px;bottom:12px;font-size:30px;font-style:italic;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 12px #f2a93b88;line-height:1}
#freq small{font-size:13px;margin-left:4px;color:#f6d9a5aa}
.controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
#playBtn{width:52px;height:52px;padding:0;display:grid;place-items:center;border-radius:50%}
#playBtn svg{width:22px;height:22px;fill:#fff}
.vol{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;font-style:italic;font-weight:600;text-transform:uppercase}
input[type=range]{width:120px;accent-color:var(--yellow)}
#hint{color:var(--yellow);font-weight:600;min-height:22px;font-size:15px}

/* 地図ウィジェット */
#mapwrap{position:fixed;z-index:600;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px;align-items:stretch}
#mapbox{width:300px;height:210px;border-radius:16px;overflow:hidden;border:3px solid #ffffffd0;box-shadow:0 12px 30px #000a;
  transition:width .25s ease,height .25s ease;background:#dfe5ea}
body:not(.result) #mapwrap:hover #mapbox{width:min(62vw,880px);height:min(60vh,580px)}
#map{width:100%;height:100%;background:#dfe5ea}
.leaflet-container{font-family:"Hind",sans-serif}
.leaflet-control-attribution{font-size:9px}
#mapwrap .gbtn{width:100%;font-size:19px;padding:12px}
body.result #mapwrap{inset:0;gap:0}
body.result #mapbox{width:100%;height:100%;border:0;border-radius:0;flex:1}
body.result #guessBtn{display:none}

/* 結果パネル */
#result{position:fixed;z-index:800;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,140%);width:min(540px,calc(100vw - 24px));
  background:linear-gradient(180deg,#2d2970,#1c1850);border-radius:22px;padding:20px 22px 22px;text-align:center;
  box-shadow:0 18px 50px #000a,inset 0 0 0 1px var(--line);transition:transform .45s cubic-bezier(.2,.9,.3,1)}
#result.show{transform:translate(-50%,0)}
#rName{margin:0;font-size:22px;font-weight:700;line-height:1.3}
#rLoc{color:var(--mute);font-size:14px;margin-bottom:12px}
#rPts{font-size:46px;font-style:italic;font-weight:700;color:var(--yellow);line-height:1;font-variant-numeric:tabular-nums}
#rPts small{font-size:18px;margin-left:6px}
.bar{height:12px;background:#0d0a2688;border-radius:999px;margin:10px auto 12px;overflow:hidden;max-width:380px}
#rBar{height:100%;width:0;background:linear-gradient(90deg,#f6a21a,var(--yellow));border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
#rDist{color:#fff;font-size:15px;margin-bottom:6px}
#rDist b{color:var(--yellow);font-size:17px}
#rLink{color:var(--mute);font-size:13px}
#nextBtn{margin-top:14px;min-width:220px}

/* オーバーレイ */
#overlay{position:fixed;inset:0;z-index:900;background:#0d0a29d9;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
#overlay.hide{display:none}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:26px;padding:30px 28px;max-width:480px;width:100%;text-align:center;
  box-shadow:0 24px 70px #000b,inset 0 0 0 1px var(--line)}
.logo{display:flex;align-items:center;justify-content:center;gap:2px;font-size:clamp(34px,9vw,46px);font-style:italic;font-weight:700;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.logo svg{width:34px;height:44px;margin:0 -1px;transform:translateY(-2px)}
.card p{margin:12px 0;color:#d9d5f5;font-size:14px;line-height:1.8;text-align:left}
.card .fine{font-size:12px;color:var(--mute)}
.card .err{color:#ff9aa8;font-weight:700}
.card .gbtn{margin-top:8px}
.big{font-size:64px;font-style:italic;font-weight:700;color:var(--yellow);line-height:1.05;font-variant-numeric:tabular-nums}
.rank{font-size:26px;font-style:italic;font-weight:700;text-transform:uppercase}
.rows{margin:14px 0;text-align:left;background:#0d0a2666;border-radius:14px;padding:6px 14px}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.rows div+div{border-top:1px solid var(--line)}
.rows span:last-child{font-style:italic;font-weight:700;color:var(--yellow);white-space:nowrap}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

@media (max-width:700px){
  #hud div{padding:6px 12px;min-width:60px}#hud b{font-size:17px}
  #seg button{padding:5px 12px;font-size:12px}
  #mapwrap{right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px)}
  #mapbox{width:46vw;height:30vh}
  body:not(.result) #mapwrap:hover #mapbox{width:92vw;height:56vh}
  .dial{height:120px}.nums{top:66px}.scale{top:18px}
  #stage{padding-bottom:36vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="hud">
  <div><small>Map</small><b>World</b></div>
  <div><small>Round</small><b id="hRound">1 / 5</b></div>
  <div><small>Score</small><b id="hScore">0</b></div>
</div>
<div id="seg" role="group" aria-label="Map difficulty">
  <button id="mNormal" aria-pressed="true">Normal</button>
  <button id="mHard" aria-pressed="false">Hard</button>
</div>

<main id="stage">
  <div id="status">Loading</div>
  <div id="sub"></div>
  <section class="radio" aria-label="Radio">
    <div class="dial" id="dial" aria-hidden="true">
      <div class="scale"></div>
      <div class="nums"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div>
      <div class="needle" id="needle"></div>
      <div id="freq">--.-<small>MHz</small></div>
    </div>
    <div class="controls">
      <button class="gbtn" id="playBtn" disabled aria-label="Play / pause"></button>
      <label class="vol">Vol <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
      <button class="gbtn yellow sm" id="hintBtn" disabled>Hint</button>
      <button class="gbtn sm" id="skipBtn" disabled>Skip</button>
    </div>
  </section>
  <div id="hint"></div>
</main>

<div id="mapwrap">
  <div id="mapbox"><div id="map"></div></div>
  <button class="gbtn green" id="guessBtn" disabled>Place your pin on the map</button>
</div>

<section id="result" aria-live="polite">
  <h2 id="rName"></h2>
  <div id="rLoc"></div>
  <div id="rPts"></div>
  <div class="bar"><div id="rBar"></div></div>
  <div id="rDist"></div>
  <a id="rLink" target="_blank" rel="noopener">Station website</a><br>
  <button class="gbtn yellow" id="nextBtn">Next round</button>
</section>

<div id="overlay"><div class="card" id="card"></div></div>
<audio id="audio" preload="none"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const ROUNDS = 5, MAXPTS = 5000;
const $ = id => document.getElementById(id);
const audio = $("audio");
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const LOGO_PIN = '<svg viewBox="0 0 30 40"><path d="M15 39S2 24 2 14.5C2 7 7.8 1.5 15 1.5S28 7 28 14.5C28 24 15 39 15 39Z" fill="#e8445a" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="14.5" r="3" fill="#fff"/><path d="M9.5 9.5a7.8 7.8 0 0 0 0 10M20.5 9.5a7.8 7.8 0 0 1 0 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';

let places = [], cum = [], total = 0;
let round = 0, score = 0, cur = null, guess = null, hinted = false, phase = "loading", token = 0;
const results = [];

/* ---------- 地図 (APIキー不要のEsriタイル) ---------- */
const map = L.map("map", { minZoom: 1, maxZoom: 10, worldCopyJump: true, zoomControl: false, attributionControl: false }).setView([20, 10], 1);
L.control.attribution({ prefix: false }).addTo(map);
const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
L.tileLayer(esri + "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 10, attribution: "Tiles © Esri" }).addTo(map);
const labelLayer = L.tileLayer(esri + "World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 10 }).addTo(map);
function setMode(hard) {
  if (hard) map.removeLayer(labelLayer); else labelLayer.addTo(map);
  $("mNormal").setAttribute("aria-pressed", !hard); $("mHard").setAttribute("aria-pressed", hard);
}
$("mNormal").onclick = () => setMode(false);
$("mHard").onclick = () => setMode(true);
new ResizeObserver(() => map.invalidateSize()).observe($("mapbox"));

const pinSvg = c => `<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 39S2 24 2 14.5C2 7 7.8 1.5 15 1.5S28 7 28 14.5C28 24 15 39 15 39Z" fill="${c}" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="14.5" r="5" fill="#fff"/></svg>`;
const pin = c => L.divIcon({ className: "", html: pinSvg(c), iconSize: [30, 40], iconAnchor: [15, 39] });
let gMarker, aMarker, line;
function clearMarkers() { [gMarker, aMarker, line].forEach(x => x && map.removeLayer(x)); gMarker = aMarker = line = null; }

map.on("click", e => {
  if (phase !== "guess") return;
  guess = e.latlng;
  if (gMarker) gMarker.setLatLng(guess); else gMarker = L.marker(guess, { icon: pin("#7950e8") }).addTo(map);
  $("guessBtn").disabled = false; $("guessBtn").textContent = "Guess";
});
function resetGuessBtn() {
  $("guessBtn").disabled = true; $("guessBtn").textContent = "Place your pin on the map";
}

/* ---------- データ (Radio Browser API) ---------- */
const SERVERS = ["https://de1.api.radio-browser.info","https://de2.api.radio-browser.info","https://at1.api.radio-browser.info","https://nl1.api.radio-browser.info"];
let base = null;
async function rb(path) {
  const order = base ? [base, ...SERVERS.filter(x => x !== base)] : [...SERVERS].sort(() => Math.random() - .5);
  let err;
  for (const sv of order) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(sv + path, { signal: ctl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(); base = sv; return j;
    } catch (e) { err = e; }
  }
  throw err;
}
async function loadPlaces() {
  const j = await rb("/json/countries");
  places = j.filter(c => c.iso_3166_1 && c.stationcount >= 3);
  if (!places.length) throw new Error("no countries");
  total = 0; cum = places.map(c => (total += Math.sqrt(c.stationcount)));
}
function pickPlace() {
  const x = Math.random() * total;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; cum[m] < x ? lo = m + 1 : hi = m; }
  return places[lo];
}
async function pickStation() {
  const c = pickPlace();
  const list = await rb(`/json/stations/search?countrycode=${c.iso_3166_1}&has_geo_info=true&hidebroken=true&order=random&limit=20`);
  const https = location.protocol === "https:";
  const ok = list.filter(s => {
    const u = s.url_resolved || "";
    return s.geo_lat != null && s.geo_long != null && (https ? u.startsWith("https://") : /^https?:/.test(u));
  });
  if (!ok.length) throw new Error("empty");
  const s = ok[Math.floor(Math.random() * ok.length)];
  const country = s.country || c.name;
  return { place: { geo: [s.geo_long, s.geo_lat], title: s.state || country, country },
           stream: s.url_resolved, name: (s.name || "").trim() || "Unknown station", url: s.homepage || "" };
}
function tryPlay(src) {
  return new Promise(res => {
    let t;
    const done = ok => { clearTimeout(t); audio.removeEventListener("playing", onP); audio.removeEventListener("error", onE); res(ok); };
    const onP = () => done(true), onE = () => done(false);
    audio.addEventListener("playing", onP); audio.addEventListener("error", onE);
    t = setTimeout(() => { audio.pause(); done(false); }, 10000);
    audio.src = src;
    audio.play().catch(() => {});
  });
}

/* ---------- ダイヤル ---------- */
const dial = $("dial"), needle = $("needle");
let sweep;
function setNeedle(pct) {
  needle.style.left = `calc(20px + (100% - 40px) * ${pct / 100})`;
  $("freq").innerHTML = `${(87.5 + pct / 100 * 20.5).toFixed(1)}<small>MHz</small>`;
}
function startTuning() {
  dial.classList.add("tuning"); dial.classList.remove("off");
  clearInterval(sweep);
  const move = () => setNeedle(Math.random() * 100);
  move(); sweep = setInterval(move, 340);
}
function lockTuning() { clearInterval(sweep); dial.classList.remove("tuning"); setNeedle(8 + Math.random() * 84); }

/* ---------- ラウンド進行 ---------- */
function setStatus(main, sub = "") { $("status").textContent = main; $("sub").textContent = sub; }
function lockUI(on) { ["playBtn", "hintBtn", "skipBtn"].forEach(id => $(id).disabled = on); }

async function tune() {
  const my = ++token;
  phase = "loading"; lockUI(true); audio.pause();
  resetGuessBtn(); hinted = false; $("hint").textContent = "";
  setStatus("Tuning in…", "電波を探しています"); startTuning();
  for (let i = 0; i < 12; i++) {
    try {
      const s = await pickStation();
      if (my !== token) return;
      if (await tryPlay(s.stream)) {
        if (my !== token) return;
        cur = s; lockTuning(); phase = "guess";
        setStatus("On air", "この局はどこの国・街?");
        $("playBtn").innerHTML = ICON_PAUSE; lockUI(false);
        if (guess) { $("guessBtn").disabled = false; $("guessBtn").textContent = "Guess"; }
        return;
      }
    } catch (e) { /* 次の局へ */ }
    if (my !== token) return;
  }
  clearInterval(sweep); dial.classList.remove("tuning"); dial.classList.add("off");
  setStatus("No signal", "局をつかめませんでした。Skipで再チューニング");
  $("skipBtn").disabled = false;
}

function startRound() {
  round++; guess = null; clearMarkers();
  document.body.classList.remove("result");
  $("result").classList.remove("show");
  $("hRound").textContent = `${round} / ${ROUNDS}`;
  map.invalidateSize(); map.setView([20, 10], 1);
  tune();
}

function haversine(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function countUp(el, to, ms = 900) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { el.firstChild.nodeValue = to.toLocaleString(); return; }
  const t0 = performance.now();
  (function f(t) {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.firstChild.nodeValue = Math.round(to * e).toLocaleString();
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}

function submit() {
  if (phase !== "guess" || !guess) return;
  phase = "result";
  const ans = L.latLng(cur.place.geo[1], cur.place.geo[0]);
  const d = haversine(guess, ans);
  let pts = Math.round(MAXPTS * Math.exp(-d / 1492.7));
  if (hinted) pts = Math.round(pts * 0.7);
  score += pts; $("hScore").textContent = score.toLocaleString();
  results.push({ d, pts, name: cur.name, place: [...new Set([cur.place.title, cur.place.country])].join(", ") });

  document.body.classList.add("result");
  map.invalidateSize();
  aMarker = L.marker(ans, { icon: pin("#e8445a") }).addTo(map);
  line = L.polyline([guess, ans], { color: "#4d2fb0", weight: 3, dashArray: "2 8", lineCap: "round" }).addTo(map);
  map.fitBounds(L.latLngBounds([guess, ans]), { paddingTopLeft: [70, 90], paddingBottomRight: [70, 300], maxZoom: 6 });

  $("rName").textContent = cur.name;
  $("rLoc").textContent = [...new Set([cur.place.title, cur.place.country])].filter(Boolean).join(", ");
  $("rPts").innerHTML = '0<small>points</small>';
  $("rBar").style.width = "0";
  $("rDist").innerHTML = `正解地点から <b>${d < 10 ? d.toFixed(1) : Math.round(d).toLocaleString()} km</b>${hinted ? "(ヒント使用 -30%)" : ""}`;
  $("rLink").href = cur.url || "#"; $("rLink").style.display = cur.url ? "" : "none";
  $("nextBtn").textContent = round >= ROUNDS ? "View summary" : "Next round";
  $("result").classList.add("show");
  $("hintBtn").disabled = true;
  requestAnimationFrame(() => { $("rBar").style.width = (pts / MAXPTS * 100) + "%"; countUp($("rPts"), pts); });
}

function resetGame() { round = 0; score = 0; results.length = 0; $("hScore").textContent = "0"; }

function showIntro() {
  $("card").innerHTML = `
    <div class="logo">Radio${LOGO_PIN}Guessr</div>
    <p>世界のどこかのラジオ局が流れます。言語、音楽、DJのしゃべり、広告の雰囲気から、放送地点を地図にピンで当てましょう。全${ROUNDS}ラウンド、1ラウンド最大${MAXPTS}点です。</p>
    <p>地図は右下にあります。マウスを乗せると大きくなります。Hintを使うと国名がわかりますが、そのラウンドの得点は30%減ります。</p>
    <p class="fine">局データ: Radio Browser(コミュニティDB)。位置情報は登録者の入力なので、実際の放送地点と少しズレる局があります。</p>
    <button class="gbtn green" id="startBtn" disabled>Loading…</button>
    <div id="introErr"></div>`;
  $("overlay").classList.remove("hide");
  loadPlaces().then(() => {
    const b = $("startBtn"); b.disabled = false; b.textContent = "Play";
    b.onclick = () => { $("overlay").classList.add("hide"); resetGame(); startRound(); };
    setStatus("Ready");
  }).catch(e => {
    $("startBtn").textContent = "Retry"; $("startBtn").disabled = false; $("startBtn").onclick = () => location.reload();
    $("introErr").innerHTML = `<p class="err">局リストを取得できませんでした(${e.message})。ネットワークや、Radio Browser APIへのアクセス制限を確認してください。</p>`;
  });
}

function showFinal() {
  const rank = score >= 20000 ? "Radio master" : score >= 14000 ? "Frequency hunter" : score >= 8000 ? "Dial turner" : "Lost in the static";
  const text = `RadioGuessr ${score}/${ROUNDS * MAXPTS}pt\n` + results.map((r, i) => `${i + 1}. ${r.place} ${Math.round(r.d).toLocaleString()}km ${r.pts}pt`).join("\n");
  audio.pause(); clearMarkers();
  document.body.classList.remove("result");
  $("card").innerHTML = `
    <div class="rank">${rank}</div>
    <div class="big">${score.toLocaleString()}</div>
    <div style="color:var(--mute);font-size:14px">/ ${(ROUNDS * MAXPTS).toLocaleString()} points</div>
    <div class="rows">${results.map((r, i) => `<div><span>${i + 1}. ${r.place}(${Math.round(r.d).toLocaleString()} km)</span><span>${r.pts.toLocaleString()}</span></div>`).join("")}</div>
    <div class="btnrow"><button class="gbtn green" id="againBtn">Play again</button><button class="gbtn" id="copyBtn">Copy result</button></div>`;
  $("overlay").classList.remove("hide");
  $("againBtn").onclick = () => { $("overlay").classList.add("hide"); resetGame(); startRound(); };
  $("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(text); $("copyBtn").textContent = "Copied"; } catch (e) { $("copyBtn").textContent = "Couldn't copy"; } };
}

/* ---------- 操作 ---------- */
$("guessBtn").onclick = submit;
$("nextBtn").onclick = () => { if (round >= ROUNDS) { $("result").classList.remove("show"); showFinal(); } else startRound(); };
$("skipBtn").onclick = () => { if (phase === "guess" || phase === "loading") tune(); };
$("hintBtn").onclick = () => {
  if (phase !== "guess" || !cur || hinted) return;
  hinted = true; $("hint").textContent = `Hint: ${cur.place.country}`; $("hintBtn").disabled = true;
};
$("playBtn").onclick = () => {
  if (audio.paused) { audio.play().catch(() => {}); $("playBtn").innerHTML = ICON_PAUSE; }
  else { audio.pause(); $("playBtn").innerHTML = ICON_PLAY; }
};
$("vol").oninput = e => audio.volume = +e.target.value;
audio.volume = 0.8;
audio.addEventListener("error", () => { if (phase === "guess") setStatus("Signal lost", "配信が途切れました。Skipで再チューニング"); });
$("playBtn").innerHTML = ICON_PAUSE;
setNeedle(50);

showIntro();
</script>
</body>
</html>
